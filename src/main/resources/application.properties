server.port=9000

spring.kafka.consumer.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=group_id

# PlainKafkaConsumerLifecycle: plain KafkaConsumer poll thread (no @KafkaListener). PlainKafkaConsumer.main unchanged.
spring.kafka.plain-consumer.enabled=true
spring.kafka.plain-consumer.topics=users,transactions
spring.kafka.plain-consumer.group-id=plain-java-consumer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.kafka.producer.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

spring.kafka.streams.application-id=spring-with-kafka-streams
spring.kafka.streams.bootstrap-servers=localhost:9092

spring.elasticsearch.uris=http://localhost:9200
# Avoid startup failure when Elasticsearch is not running. Enable indexing with profile "elasticsearch"
# (application-elasticsearch.properties) after: docker compose up -d
spring.data.elasticsearch.repositories.enabled=false

# Consumer group for the Kafka → Elasticsearch indexer (separate from other listeners).
elasticsearch.kafka.consumer-group=elasticsearch-indexer

# Commerce (catalog + cart): Kafka contracts for a future microservice split.
# Monolith: catalog publisher updates ProductCatalogProjection in-process; keep projection consumer off.
# Cart-only service: set commerce.kafka.catalog-projection-consumer-enabled=true (and turn off in-publisher projection in the catalog service).
commerce.catalog.apply-projection-in-publisher=true
commerce.kafka.catalog-projection-consumer-enabled=false
commerce.kafka.catalog-projection-consumer-group=catalog-projection
