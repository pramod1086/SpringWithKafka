server.port=9000

spring.kafka.consumer.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=group_id

# PlainKafkaConsumerLifecycle: plain KafkaConsumer poll thread (no @KafkaListener). PlainKafkaConsumer.main unchanged.
spring.kafka.plain-consumer.enabled=true
spring.kafka.plain-consumer.topics=users,transactions
spring.kafka.plain-consumer.group-id=plain-java-consumer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.kafka.producer.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

spring.kafka.streams.application-id=spring-with-kafka-streams
spring.kafka.streams.bootstrap-servers=localhost:9092

spring.elasticsearch.uris=http://localhost:9200

# Consumer group for the Kafka → Elasticsearch indexer (separate from other listeners).
elasticsearch.kafka.consumer-group=elasticsearch-indexer
